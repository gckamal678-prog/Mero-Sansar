<!DOCTYPE html>
<html lang="ne" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#2563eb">
  <meta name="description" content="हाम्रो संसार — साथी जोडौँ, कुरा गरौँ">
  <title>हाम्रो संसार</title>

  <link rel="stylesheet" href="app.css">
  <link rel="stylesheet" href="core/design-system.css">
  <link rel="manifest" href="manifest.json">

  <style>
    .hs-page { display:grid; gap:16px; }
    .hs-page-heading h2 { margin:0 0 6px; }
    .hs-page-heading p { margin:0; color:var(--muted); }
    .hs-inline-form,.hs-chat-form { display:flex; gap:8px; align-items:center; }
    .hs-inline-form .form-input,.hs-chat-form .form-input { flex:1; min-width:0; }
    .hs-list,.hs-notification-list { display:grid; gap:10px; }
    .hs-user-card,.hs-message-item,.hs-notification,.hs-chat-header {
      display:flex; align-items:center; gap:12px; padding:14px;
      border:1px solid var(--border); border-radius:14px;
      background:var(--surface); color:var(--text);
    }
    .hs-user-info,.hs-message-info { display:grid; gap:4px; flex:1; min-width:0; }
    .hs-user-info small,.hs-message-info small,.hs-notification small { color:var(--muted); }
    .hs-message-item { width:100%; text-align:left; cursor:pointer; }
    .hs-message-arrow { font-size:24px; color:var(--muted); }
    .hs-notification { align-items:flex-start; }
    .hs-notification p { margin:0 0 6px; }
    .hs-notification.unread { border-color:var(--primary); }
    .hs-notification-icon { font-size:22px; }
    .hs-profile-card,.hs-profile-form,.hs-settings-card {
      display:grid; gap:14px; padding:18px;
      border:1px solid var(--border); border-radius:16px;
      background:var(--surface); color:var(--text);
    }
    .hs-profile-card { text-align:center; justify-items:center; }
    .hs-profile-avatar {
      display:grid; place-items:center; width:76px; height:76px;
      border-radius:50%; background:var(--primary); color:#fff;
      font-size:30px; font-weight:700;
    }
    .hs-profile-card h2,.hs-profile-card p { margin:0; }
    .hs-profile-stats,.hs-profile-links {
      display:flex; flex-wrap:wrap; justify-content:center; gap:12px;
    }
    .hs-profile-form label { display:grid; gap:6px; }
    .hs-chat-page { min-height:360px; }
    .hs-chat-header { position:sticky; top:0; z-index:1; }
    .hs-chat-messages {
      display:flex; flex-direction:column; gap:10px; min-height:220px;
      max-height:55vh; overflow-y:auto; padding:12px 0;
    }
    .hs-chat-bubble {
      max-width:82%; padding:10px 14px; border-radius:16px;
      overflow-wrap:anywhere;
    }
    .hs-chat-bubble p { margin:0; }
    .hs-chat-bubble.mine { align-self:flex-end; background:var(--primary); color:#fff; }
    .hs-chat-bubble.theirs { align-self:flex-start; background:var(--background); color:var(--text); }
    .hs-chat-form { position:sticky; bottom:0; padding:10px 0; background:var(--surface); }
    .hs-profile-links button { min-width:120px; }
    @media(max-width:480px) {
      .hs-inline-form { align-items:stretch; flex-direction:column; }
      .hs-user-card { flex-wrap:wrap; }
      .hs-user-card .btn { flex:1; }
    }
  </style>
</head>

<body>
  <header class="app-header">
    <div class="header-inner">
      <div class="brand">
        <div class="brand-logo">ह</div>
        <div class="brand-text">
          <h1 class="brand-name">हाम्रो संसार</h1>
          <p class="brand-tagline">साथी जोडौँ, कुरा गरौँ</p>
        </div>
      </div>

      <div class="header-actions">
        <button class="icon-button" id="searchToggle" type="button" aria-label="खोज्नुहोस्">⌕</button>
        <button class="icon-button" id="themeToggle" type="button" aria-label="Theme">🌙</button>
        <button class="icon-button" id="settingsToggle" type="button" aria-label="सेटिङ">⚙</button>
      </div>
    </div>
  </header>

  <main class="app-main">
    <section id="searchPanel" class="search-panel hidden">
      <input id="searchInput" class="form-input" type="search"
        placeholder="पोस्ट खोज्नुहोस्..." aria-label="पोस्ट खोज्नुहोस्">
    </section>

    <section id="homePage" class="page">
      <section class="stories-section">
        <h2 class="section-title">स्टोरीहरू</h2>
        <div id="storiesList" class="stories-row"></div>
      </section>

      <section class="composer-card">
        <div class="composer-top">
          <div class="avatar">त</div>
          <button id="openComposer" class="composer-input composer-trigger" type="button">
            के सोच्दै हुनुहुन्छ?
          </button>
        </div>

        <div class="composer-actions">
          <button class="composer-tool" id="quickPhoto" type="button">📷 फोटो</button>
          <button class="composer-tool" id="quickVideo" type="button">🎥 भिडियो</button>
          <button class="composer-tool" id="quickText" type="button">✍️ लेख्नुहोस्</button>
        </div>
      </section>

      <section>
        <h2 class="section-title">नयाँ पोस्टहरू</h2>
        <div id="feedList"></div>
        <div id="emptyFeed" class="empty-state hidden">
          <div class="empty-state-icon">📝</div>
          <h3 class="empty-state-title">अहिलेसम्म पोस्ट छैन</h3>
          <p>पहिलो पोस्ट गरेर साथीहरूसँग कुरा सुरु गर्नुहोस्।</p>
        </div>
      </section>
    </section>

    <section id="otherPage" class="page hidden">
      <div class="card">
        <h2 id="otherPageTitle">पृष्ठ</h2>
        <div id="otherPageText">यो सुविधा क्रमशः थपिँदैछ।</div>
      </div>
    </section>
  </main>

  <nav class="bottom-nav" id="bottomNav" aria-label="मुख्य navigation">
    <div class="bottom-nav-inner">
      <button class="nav-item active" data-page="home" type="button">
        <span class="nav-icon">🏠</span><span>गृह</span>
      </button>
      <button class="nav-item" data-page="friends" type="button">
        <span class="nav-icon">👥</span><span>साथी</span>
      </button>
      <button class="nav-item" data-page="create" type="button">
        <span class="nav-icon">➕</span><span>बनाउनु</span>
      </button>
      <button class="nav-item" data-page="messages" type="button">
        <span class="nav-icon">💬</span><span>सन्देश</span>
      </button>
      <button class="nav-item" data-page="profile" type="button">
        <span class="nav-icon">👤</span><span>प्रोफाइल</span>
      </button>
    </div>
  </nav>

  <div id="composerModal" class="modal-backdrop hidden" aria-hidden="true">
    <section class="modal" role="dialog" aria-modal="true" aria-labelledby="composerTitle">
      <header class="modal-header">
        <h2 id="composerTitle" class="modal-title">नयाँ पोस्ट</h2>
        <button id="closeComposer" class="icon-button" type="button" aria-label="बन्द">×</button>
      </header>

      <div class="modal-body">
        <textarea id="postText" class="form-textarea"
          placeholder="के सोच्दै हुनुहुन्छ?" rows="5"></textarea>

        <div id="mediaPreview" class="media-preview hidden">
          <img id="imagePreview" class="hidden" alt="छानिएको फोटो">
          <video id="videoPreview" class="hidden" controls playsinline></video>
          <button id="removeMedia" class="btn btn-secondary" type="button">फाइल हटाउनुहोस्</button>
        </div>

        <div class="composer-actions">
          <button id="choosePhoto" class="composer-tool" type="button">📷 फोटो</button>
          <button id="chooseVideo" class="composer-tool" type="button">🎥 भिडियो</button>
          <input id="mediaInput" type="file" accept="image/*,video/*" hidden>
        </div>
      </div>

      <footer class="modal-footer">
        <button id="cancelComposer" class="btn btn-secondary" type="button">रद्द</button>
        <button id="publishButton" class="btn btn-primary" type="button">प्रकाशित गर्नुहोस्</button>
      </footer>
    </section>
  </div>

  <div id="settingsModal" class="modal-backdrop hidden" aria-hidden="true">
    <section class="modal" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
      <header class="modal-header">
        <h2 id="settingsTitle" class="modal-title">सेटिङ</h2>
        <button id="closeSettings" class="icon-button" type="button" aria-label="बन्द">×</button>
      </header>

      <div class="modal-body">
        <div class="settings-row">
          <div>
            <div class="settings-label">Theme</div>
            <div class="settings-description">Light वा Dark mode</div>
          </div>
          <button id="settingsThemeToggle" class="btn btn-secondary" type="button">बदल्नुहोस्</button>
        </div>

        <div class="settings-row">
          <div>
            <div class="settings-label">भाषा</div>
            <div class="settings-description">हाल नेपाली भाषा</div>
          </div>
          <span>नेपाली</span>
        </div>

        <div class="settings-row">
          <div>
            <div class="settings-label">स्थानीय पोस्ट</div>
            <div class="settings-description">यस उपकरणमा सुरक्षित पोस्टहरू</div>
          </div>
          <button id="clearPosts" class="btn btn-danger" type="button">मेटाउनुहोस्</button>
        </div>
      </div>
    </section>
  </div>

  <div id="toastContainer" class="toast-container" aria-live="polite"></div>

  <!-- Core modules -->
  <script src="core/state.js"></script>
  <script src="core/utils.js"></script>
  <script src="core/toast.js"></script>
  <script src="core/language.js"></script>
  <script src="core/theme.js"></script>
  <script src="core/navigation.js"></script>
  <script src="core/settings.js"></script>
  <script src="core/modal.js"></script>

  <!-- Components -->
  <script src="components/post-card.js"></script>
  <script src="components/user-card.js"></script>
  <script src="components/message-item.js"></script>

  <!-- Feature data -->
  <script src="features/local-data.js"></script>

  <!-- Page registry and page modules -->
  <script src="pages/page-registry.js"></script>
  <script src="pages/friends.js"></script>
  <script src="pages/messages.js"></script>
  <script src="pages/notifications.js"></script>
  <script src="pages/profile.js"></script>
  <script src="pages/settings.js"></script>
  <script src="pages/saved.js"></script>

  <!-- Main app must be last -->
  <script src="app.js"></script>
</body>
</html>
