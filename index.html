
<!DOCTYPE html>
<html lang="ne" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#2563eb">
  <meta name="description" content="हाम्रो संसार — साथी जोडौँ, कुरा गरौँ।">
  <meta name="color-scheme" content="light dark">

  <title>हाम्रो संसार</title>

  <link rel="stylesheet" href="core/design-system.css">
  <link rel="stylesheet" href="app.css">
  <link rel="manifest" href="manifest.json">

  <style>
    /* PROFILE SETTINGS ENTRY */

    .profile-settings-entry {
      display: none;
      justify-content: flex-end;
      margin: 0 0 14px;
    }

    body:has(.nav-item[data-page="profile"].active)
    .profile-settings-entry {
      display: flex;
    }

    .profile-settings-button {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-height: 40px;
      padding: 8px 15px;
      border: 1px solid var(--color-border);
      border-radius: 999px;
      background: var(--color-surface);
      color: var(--color-text);
      font-weight: 700;
    }

    .profile-settings-button:hover {
      background: var(--color-primary-soft);
      color: var(--color-primary);
    }

    /* HIDDEN LEGACY THEME CONTROL
       Kept for compatibility with the current app.js.
    */

    .legacy-theme-control {
      display: none !important;
    }

    .brand {
      flex-shrink: 0;
    }

    .header-actions {
      margin-left: auto;
    }

    .icon-button {
      cursor: pointer;
    }

    .bottom-nav {
      padding-bottom: calc(5px + env(safe-area-inset-bottom));
    }

    .nav-item {
      cursor: pointer;
    }

    .nav-item:active {
      transform: scale(.97);
    }

    @media (max-width: 380px) {
      .nav-item {
        font-size: 9px;
      }

      .nav-icon {
        font-size: 17px;
      }
    }
  </style>
</head>

<body>

  <!-- =====================================
       HEADER
       Logo + App Name + Search + Notification
       ===================================== -->

  <header class="app-header">
    <div class="header-inner">

      <div class="brand">
        <div class="brand-logo" aria-hidden="true">ह</div>

        <div class="brand-text">
          <h1 class="brand-name" data-i18n="appName">
            हाम्रो संसार
          </h1>

          <p class="brand-tagline" data-i18n="tagline">
            साथी जोडौँ, कुरा गरौँ
          </p>
        </div>
      </div>

      <div class="header-actions">

        <button
          class="icon-button"
          id="searchToggle"
          type="button"
          aria-label="खोज्नुहोस्"
          title="खोज्नुहोस्">
          ⌕
        </button>

        <button
          class="icon-button"
          id="notificationsToggle"
          type="button"
          aria-label="सूचनाहरू"
          title="सूचनाहरू">
          🔔
        </button>

      </div>
    </div>
  </header>


  <!-- =====================================
       MAIN CONTENT
       ===================================== -->

  <main class="app-main">

    <!-- SEARCH -->

    <section
      id="searchPanel"
      class="search-panel hidden">

      <input
        id="searchInput"
        class="form-input"
        type="search"
        placeholder="साथी वा पोस्ट खोज्नुहोस्..."
        aria-label="खोज्नुहोस्"
        data-i18n-placeholder="searchPlaceholder">

    </section>


    <!-- =================================
         HOME PAGE
         Stories + Composer + Feed
         ================================= -->

    <section id="homePage" class="page">

      <!-- STORIES -->

      <section class="stories-section">

        <h2 class="section-title" data-i18n="stories">
          स्टोरीहरू
        </h2>

        <div
          id="storiesList"
          class="stories-row">
        </div>

      </section>


      <!-- POST COMPOSER -->

      <section class="composer-card">

        <div class="composer-top">

          <div class="avatar" aria-hidden="true">
            त
          </div>

          <button
            id="openComposer"
            class="composer-input composer-trigger"
            type="button"
            data-i18n="writePost">

            के सोच्दै हुनुहुन्छ?

          </button>

        </div>


        <div class="composer-actions">

          <button
            class="composer-tool"
            id="quickPhoto"
            type="button"
            data-i18n="photo">

            📷 फोटो

          </button>

          <button
            class="composer-tool"
            id="quickVideo"
            type="button"
            data-i18n="video">

            🎥 भिडियो

          </button>

          <button
            class="composer-tool"
            id="quickText"
            type="button">

            ✍️ लेख्नुहोस्

          </button>

        </div>

      </section>


      <!-- NEWS FEED -->

      <section class="feed-section">

        <h2 class="section-title" data-i18n="feed">
          नयाँ पोस्टहरू
        </h2>

        <div id="feedList"></div>

        <div
          id="emptyFeed"
          class="empty-state hidden">

          <div class="empty-state-icon">
            📝
          </div>

          <h3
            class="empty-state-title"
            data-i18n="emptyFeed">

            अहिलेसम्म पोस्ट छैन

          </h3>

          <p>
            पहिलो पोस्ट गरेर साथीहरूसँग कुरा सुरु गर्नुहोस्।
          </p>

        </div>

      </section>

    </section>


    <!-- =================================
         OTHER PAGES
         Friends / Messages / Profile
         ================================= -->

    <section
      id="otherPage"
      class="page hidden">

      <div class="card">

        <h2 id="otherPageTitle">
          पृष्ठ
        </h2>

        <!-- SETTINGS ENTRY
             Visible only when Profile is selected.
        -->

        <div class="profile-settings-entry">

          <button
            id="settingsToggle"
            class="profile-settings-button"
            type="button">

            ⚙️ सेटिङ

          </button>

        </div>

        <div id="otherPageText">
          <p>
            यो सुविधा क्रमशः थपिँदैछ।
          </p>
        </div>

      </div>

    </section>

  </main>


  <!-- =====================================
       BOTTOM NAVIGATION
       Exactly 5 items
       ===================================== -->

  <nav
    class="bottom-nav"
    id="bottomNav"
    aria-label="मुख्य Navigation">

    <div class="bottom-nav-inner">

      <button
        class="nav-item active"
        type="button"
        data-page="home"
        aria-label="Home">

        <span class="nav-icon">🏠</span>
        <span data-i18n="home">होम</span>

      </button>


      <button
        class="nav-item"
        type="button"
        data-page="friends"
        aria-label="Friends">

        <span class="nav-icon">👥</span>
        <span data-i18n="friends">साथीहरू</span>

      </button>


      <button
        class="nav-item"
        type="button"
        data-page="create"
        aria-label="Create">

        <span class="nav-icon">➕</span>
        <span data-i18n="create">बनाउनुहोस्</span>

      </button>


      <button
        class="nav-item"
        type="button"
        data-page="messages"
        aria-label="Messages">

        <span class="nav-icon">💬</span>
        <span data-i18n="messages">सन्देश</span>

      </button>


      <button
        class="nav-item"
        type="button"
        data-page="profile"
        aria-label="Profile">

        <span class="nav-icon">👤</span>
        <span data-i18n="profile">प्रोफाइल</span>

      </button>

    </div>

  </nav>


  <!-- =====================================
       CREATE POST MODAL
       ===================================== -->

  <div
    id="composerModal"
    class="modal-backdrop hidden"
    aria-hidden="true">

    <section
      class="modal"
      role="dialog"
      aria-modal="true"
      aria-labelledby="composerTitle">

      <header class="modal-header">

        <h2
          id="composerTitle"
          class="modal-title">

          नयाँ पोस्ट

        </h2>

        <button
          id="closeComposer"
          class="icon-button"
          type="button"
          aria-label="बन्द गर्नुहोस्">

          ×

        </button>

      </header>


      <div class="modal-body">

        <textarea
          id="postText"
          class="form-textarea"
          placeholder="के सोच्दै हुनुहुन्छ?"
          rows="5">
        </textarea>


        <!-- MEDIA PREVIEW -->

        <div
          id="mediaPreview"
          class="media-preview hidden">

          <img
            id="imagePreview"
            class="hidden"
            alt="छानिएको फोटो">

          <video
            id="videoPreview"
            class="hidden"
            controls
            playsinline>
          </video>

          <button
            id="removeMedia"
            class="btn btn-secondary"
            type="button">

            फाइल हटाउनुहोस्

          </button>

        </div>


        <!-- MEDIA SELECT -->

        <div class="composer-actions">

          <button
            id="choosePhoto"
            class="composer-tool"
            type="button">

            📷 फोटो

          </button>

          <button
            id="chooseVideo"
            class="composer-tool"
            type="button">

            🎥 भिडियो

          </button>

          <input
            id="mediaInput"
            type="file"
            accept="image/*,video/*"
            hidden>

        </div>

      </div>


      <footer class="modal-footer">

        <button
          id="cancelComposer"
          class="btn btn-secondary"
          type="button">

          रद्द

        </button>

        <button
          id="publishButton"
          class="btn btn-primary"
          type="button">

          प्रकाशित गर्नुहोस्

        </button>

      </footer>

    </section>

  </div>


  <!-- =====================================
       SETTINGS MODAL
       Opened from Profile only
       ===================================== -->

  <div
    id="settingsModal"
    class="modal-backdrop hidden"
    aria-hidden="true">

    <section
      class="modal"
      role="dialog"
      aria-modal="true"
      aria-labelledby="settingsTitle">

      <header class="modal-header">

        <h2
          id="settingsTitle"
          class="modal-title">

          ⚙️ सेटिङ

        </h2>

        <button
          id="closeSettings"
          class="icon-button"
          type="button"
          aria-label="बन्द गर्नुहोस्">

          ×

        </button>

      </header>


      <div class="modal-body">


        <!-- THEME SETTINGS -->

        <div class="settings-row">

          <div>

            <div class="settings-label" data-i18n="theme">
              Theme
            </div>

            <div
              class="settings-description"
              data-i18n="themeDescription">

              Light वा Dark mode

            </div>

          </div>

          <button
            id="settingsThemeToggle"
            class="btn btn-secondary"
            type="button"
            data-i18n="change">

            बदल्नुहोस्

          </button>

        </div>


        <!-- LANGUAGE SETTINGS -->

        <div class="settings-row">

          <div>

            <div class="settings-label" data-i18n="language">
              भाषा
            </div>

            <div
              class="settings-description"
              data-i18n="languageDescription">

              एपको भाषा छान्नुहोस्।

            </div>

          </div>

          <select
            id="languageSelect"
            class="form-input settings-select"
            aria-label="भाषा छान्नुहोस्">

            <option value="ne">नेपाली</option>
            <option value="en">English</option>

          </select>

        </div>


        <!-- LOCAL DATA -->

        <div class="settings-row">

          <div>

            <div class="settings-label" data-i18n="localData">
              स्थानीय डाटा
            </div>

            <div
              class="settings-description"
              data-i18n="localDataDescription">

              यस उपकरणमा सुरक्षित demo data

            </div>

          </div>

          <button
            id="clearPosts"
            class="btn btn-danger"
            type="button"
            data-i18n="delete">

            मेटाउनुहोस्

          </button>

        </div>

      </div>

    </section>

  </div>


  <!-- =====================================
       TOAST NOTIFICATIONS
       ===================================== -->

  <div
    id="toastContainer"
    class="toast-container"
    aria-live="polite"
    aria-atomic="true">
  </div>


  <!-- =====================================
       APP SCRIPTS
       Keep dependency order
       ===================================== -->

  <script src="core/state.js"></script>
  <script src="core/settings.js"></script>
  <script src="core/theme.js"></script>
  <script src="core/language.js"></script>
  <script src="core/navigation.js"></script>
  <script src="core/toast.js"></script>
  <script src="core/utils.js"></script>

  <script src="app.js"></script>


  <!-- LANGUAGE SELECT CONNECTION -->

  <script>
    document.addEventListener("DOMContentLoaded", function () {

      const languageSelect =
        document.getElementById("languageSelect");

      if (!languageSelect) return;

      if (window.HamroLanguage) {
        languageSelect.value =
          window.HamroLanguage.getLanguage();
      }

      languageSelect.addEventListener("change", function () {

        const language =
          this.value === "en" ? "en" : "ne";

        if (window.HamroSettings) {
          window.HamroSettings.updateSettings({
            language: language
          });
        }

        if (window.HamroLanguage) {
          window.HamroLanguage.setLanguage(language);
        }

        if (window.HamroToast) {
          window.HamroToast.success(
            language === "en"
              ? "Language updated."
              : "भाषा परिवर्तन भयो।"
          );
        }

      });

    });
  </script>

</body>
</html>
