
<!-- WELCOME SPLASH CONTROLLER -->
<script>
(function () {
  "use strict";

  var splash = document.getElementById("welcomeSplash");
  var start = document.getElementById("welcomeStartButton");

  if (!splash || !start) return;

  var seenKey = "mero_sansar_welcome_seen_v1";
  var seen = false;

  try {
    seen = localStorage.getItem(seenKey) === "yes";
  } catch (error) {}

  if (!seen) {
    splash.hidden = false;
    document.body.classList.add("welcome-splash-active");
  }

  function enterApp() {
    try {
      localStorage.setItem(seenKey, "yes");
    } catch (error) {}

    splash.classList.add("welcome-splash-leaving");
    document.body.classList.remove("welcome-splash-active");

    window.setTimeout(function () {
      splash.hidden = true;
      splash.classList.remove("welcome-splash-leaving");
    }, 520);
  }

  start.addEventListener("click", enterApp);

})();
</script>
